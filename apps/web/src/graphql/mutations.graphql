# Submit feedback and request both the saved entity and structured user errors.
mutation SubmitFeedback($input: SubmitFeedbackInput!) {
  submitFeedback(input: $input) {
    feedback {
      __typename
      id
      event {
        __typename
        id
        name
      }
      text
      rating
      createdAt
    }
    errors {
      field
      code
      message
    }
  }
}
