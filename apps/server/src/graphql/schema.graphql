type Event {
  id: ID!
  name: String!
}

type Feedback {
  id: ID!
  event: Event!
  text: String!
  rating: Int!
  createdAt: String!
}

type Query {
  events: [Event!]!
  feedback(
    eventId: ID!
    rating: Int
    first: Int = 20
    after: String
  ): FeedbackConnection!
}

type FeedbackConnection {
  items: [Feedback!]!
  pageInfo: PageInfo!
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
}

input SubmitFeedbackInput {
  eventId: ID!
  text: String!
  rating: Int!
}

enum FeedbackErrorCode {
  INVALID_EVENT
  EMPTY_TEXT
  TEXT_TOO_LONG
  INVALID_RATING
}

type UserError {
  field: String
  code: FeedbackErrorCode!
  message: String!
}

type SubmitFeedbackPayload {
  feedback: Feedback
  errors: [UserError!]!
}

type Mutation {
  submitFeedback(input: SubmitFeedbackInput!): SubmitFeedbackPayload!
}
