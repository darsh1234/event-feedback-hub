overwrite: true
schema: apps/server/src/graphql/schema.graphql
generates:
  apps/server/src/graphql/generated/resolver-types.ts:
    plugins:
      - typescript
      - typescript-resolvers
    config:
      contextType: ../context.js#GraphQLContext
      mappers:
        Event: ../../repositories/eventRepository.js#EventRecord
        Feedback: ../../repositories/feedbackRepository.js#FeedbackRecord
      useIndexSignature: true
      useTypeImports: true
hooks:
  afterOneFileWrite:
    - prettier --write
